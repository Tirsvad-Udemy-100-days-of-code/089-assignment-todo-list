[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-list"
version = "0.1.0"
description = "Trello-style Kanban todo list built with the Python standard library."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
todo-list = "todo_list.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src", "tests"]
addopts = "--cov=todo_list --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src:tests"
